  hub:
    type: room
    group: program
    name: Dusk hub — pkg/bus
    description: Status of the pkg/bus retirement. Decisions are made here; the per-team work happens
      in the team rooms.
    bridge: '{bridge}'
    channel_type: channel_private
    agents:
    - dusk
    - steward
    users:
    - '{$creator}'
    instructions: |
      This is the hub. The platform lead is {lead}. Dusk rests here between trips to team rooms and keeps the status document here. Steward watches here and speaks only to propose or report a change to Fixer's reach.

      Retirement bindings (read these on every arrival; they override defaults):
      - repo: https://github.com/grafana/grafana
      - endpoint: pkg/bus
      - grep_pattern: github.com/grafana/grafana/pkg/bus"
      - include: pkg/**/*.go
      - exclude: **/*_test.go
      - declaring: pkg/bus/**
      - replacement: direct service calls (inject the service, call its method) instead of bus.Publish / AddEventListener
      - target_date: 2027-03-31
      - fork: https://github.com/Manvith-Shetty/grafana (every PR is opened here, never on repo)
      - lead: {lead}
      - hub_room: Dusk hub — pkg/bus
      - state_file: state.json in the Dusk Room checkout (write it only through duskctl)
    kickoff: |-
      @{dusk.name} start the retirement of pkg/bus. Discover the callers, post the table here, create the status document, then open a thread per team in its room and ask for a date.

      @{steward.name} you are watching. Say nothing until the ledger gives you something to propose.
  team_backend_services:
    type: room
    group: program
    name: Backend Services — pkg/bus
    description: 'Backend Services and the pkg/bus retirement: 7 call sites in 7 files.'
    bridge: '{bridge}'
    channel_type: channel_private
    agents:
    - dusk
    - fixer
    users:
