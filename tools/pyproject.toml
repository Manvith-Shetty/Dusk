[project]
name = "duskctl"
version = "0.1.0"
description = "Deterministic tooling for Dusk Room: discover callers, map them to CODEOWNERS teams, keep the retirement state, render status."
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = ["pyyaml>=6.0"]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
duskctl = "duskctl.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["duskctl*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
